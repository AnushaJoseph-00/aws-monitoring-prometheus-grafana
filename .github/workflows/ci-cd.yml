name: Application CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'

env:
  AWS_REGION: us-east-1
  ECR_BACKEND: tomato-backend
  ECR_FRONTEND: tomato-frontend
  ECR_ADMIN: tomato-admin
  ECS_CLUSTER: tomato-cluster
  ECS_BACKEND_SERVICE: tomato-backend-service
  ECS_FRONTEND_SERVICE: tomato-frontend-service
  ECS_ADMIN_SERVICE: tomato-admin-service

jobs:
  # Stage 1 — Build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend image
        run: docker build -t $ECR_BACKEND:latest ./backend

      - name: Build frontend image
        run: docker build -t $ECR_FRONTEND:latest ./frontend

      - name: Build admin image
        run: docker build -t $ECR_ADMIN:latest ./admin

  # Stage 2 — Scan
  trivy-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend image for scanning
        run: docker build -t $ECR_BACKEND:latest ./backend

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_BACKEND }}:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Build frontend image for scanning
        run: docker build -t $ECR_FRONTEND:latest ./frontend

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_FRONTEND }}:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Build admin image for scanning
        run: docker build -t $ECR_ADMIN:latest ./admin

      - name: Trivy scan admin
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_ADMIN }}:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

  # Stage 3 — Push to ECR
  push:
    runs-on: ubuntu-latest
    needs: trivy-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND:${{ github.sha }} ./backend
          docker tag $ECR_REGISTRY/$ECR_BACKEND:${{ github.sha }} $ECR_REGISTRY/$ECR_BACKEND:latest
          docker push $ECR_REGISTRY/$ECR_BACKEND:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_BACKEND:latest

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND:${{ github.sha }} ./frontend
          docker tag $ECR_REGISTRY/$ECR_FRONTEND:${{ github.sha }} $ECR_REGISTRY/$ECR_FRONTEND:latest
          docker push $ECR_REGISTRY/$ECR_FRONTEND:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_FRONTEND:latest

      - name: Build and push admin
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_ADMIN:${{ github.sha }} ./admin
          docker tag $ECR_REGISTRY/$ECR_ADMIN:${{ github.sha }} $ECR_REGISTRY/$ECR_ADMIN:latest
          docker push $ECR_REGISTRY/$ECR_ADMIN:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_ADMIN:latest

  # Stage 4 — Deploy to ECS
  deploy:
    runs-on: ubuntu-latest
    needs: push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_BACKEND_SERVICE \
            --force-new-deployment

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_FRONTEND_SERVICE \
            --force-new-deployment

      - name: Deploy admin to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_ADMIN_SERVICE \
            --force-new-deployment